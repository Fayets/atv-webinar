services:
  backend:
    build: ./backend
    container_name: atv-webinar-join-backend
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - ./backend/.env
    ports:
      - "8017:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: atv-webinar-join-frontend
    ports:
      - "8097:80"
    depends_on:
      - backend
    restart: unless-stopped
