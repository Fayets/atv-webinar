server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto el JS y el CSS viajan crudos: en una red móvil son segundos antes
    # de que la página pueda arrancar.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los assets llevan hash en el nombre: si cambia el contenido cambia el
    # nombre, así que se pueden cachear un año. El HTML nunca, o el navegador se
    # queda con una versión vieja después de cada deploy.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Los legales tienen su propio HTML prerenderizado; el resto de las rutas
    # (/ty-page, /dashboard) las resuelve el router del cliente.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
